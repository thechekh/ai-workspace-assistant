name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a dependency that was clean at merge time can become vulnerable.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Uploading CodeQL results to a PRIVATE repository requires GitHub
    # Advanced Security; without it the analysis runs fine but the upload
    # 403s, leaving a permanently red workflow. Skip rather than fail — this
    # turns itself on the moment the repo goes public or GHAS is enabled.
    # The dependency audit below is unconditional and is what caught real
    # vulnerabilities.
    if: github.event.repository.private == false
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      actions: read # CodeQL reads workflow-run metadata when uploading
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Audit the resolved runtime tree — what actually ships in the image.
      - name: pip-audit (python)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit --requirement requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
