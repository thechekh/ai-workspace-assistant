# Golden retrieval set v1 — real engineer questions mapped to where the
# answer lives in docs_corpus/. Used by evals/run_retrieval.py for
# recall@k + MRR, and reused in Phase 7 for the embedding comparison.
#
# expect_source: corpus-relative file that must appear in the top-k
# expect_text:   (optional) substring that must appear in that chunk

- question: Which service is responsible for invoice generation?
  expect_source: architecture/services.md
  expect_text: billing-service
- question: How does the payment adapter work?
  expect_source: architecture/services.md
  expect_text: payment-adapter
- question: Which services consume SQS queues?
  expect_source: architecture/services.md
  expect_text: SQS
- question: How do we prevent double-charging a customer on retries?
  expect_source: architecture/services.md
  expect_text: idempotency
- question: Which service handles user authentication?
  expect_source: architecture/services.md
  expect_text: auth-service
- question: What is our deployment architecture?
  expect_source: architecture/deployment.md
- question: How do we deploy to production?
  expect_source: architecture/deployment.md
  expect_text: ArgoCD
- question: What Kubernetes platform do we run on?
  expect_source: architecture/deployment.md
  expect_text: EKS
- question: How are secrets managed?
  expect_source: architecture/deployment.md
  expect_text: Secrets Manager
- question: How do we roll back a bad production deploy?
  expect_source: architecture/deployment.md
  expect_text: revert
- question: What linter and formatter do we use for Python?
  expect_source: guidelines/coding-standards.md
