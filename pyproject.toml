[project]
name = "ai-workspace-assistant"
version = "0.1.0"
description = "Internal AI workspace assistant — agentic FastAPI backend with MCP tools and Qdrant RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "openai>=3.0",  # 3.0 moved the SDK's own transport to httpx2
    "qdrant-client>=1.12",
    # 2.0 renamed the server class back: FastMCP -> MCPServer, under
    # mcp.server.mcpserver. The client half (ClientSession, stdio_client,
    # streamable_http_client) is unchanged.
    "mcp>=2.2",
    "pydantic-ai>=2.27",  # 2.x moved FunctionToolResultEvent.result -> .part
    "langgraph>=0.6",
    "langchain-core>=0.3",  # imported directly by the LangGraph backend adapter
    "logfire[fastapi,httpx]>=5.0",
    "opentelemetry-api>=1.27",  # telemetry.py imports the tracer API directly
    "opentelemetry-sdk>=1.27",  # observability.py builds the provider directly
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "fakeredis>=2.26",  # ASSISTANT_REDIS_URL=fakeredis:// is a documented runtime mode
    # One HTTP client for everything we write. The OpenAI SDK (3.0) and the
    # MCP SDK (2.0) both moved to httpx2 and type-check what they are handed,
    # so our own calls speak the same dialect rather than converting at each
    # boundary. `httpx` 0.x is still in the tree — langchain-core, langgraph
    # and qdrant-client require it — but nothing we write imports it.
    "httpx2>=2.12",
    "python-multipart>=0.0.9",  # multipart uploads for POST /api/documents
]

[dependency-groups]
# Opt-in: `uv sync --group evals`. Deliberately NOT a runtime dependency and
# not in `dev` — ragas pulls ~35 packages (datasets, pandas, pyarrow, scipy,
# huggingface-hub) that would roughly double the Docker image, and every one
# of its metrics is an LLM call, so nothing here can run in the offline suite.
# See docs/reference/metrics.md for why it sits outside CI.
#
# It is not free even so: uv resolves every group into one lock, so ragas'
# transitive `openai<3.11` (via instructor) holds the *application* at openai
# 3.3 rather than 3.11, and pydantic-ai at 2.38 rather than 2.42. Both were
# tried — the suite is green on the newer pair — and both ways out were worse:
# `[tool.uv] conflicts` does not fork here (project dependencies apply to every
# fork), and a `python_full_version < '3.14'` marker would split the lock so
# that CI, which runs 3.12 and 3.13, tested a different openai than a developer
# on 3.14. One lock, one tested set, everywhere. Revisit when ragas' dependency
# chain catches up.
evals = [
    # <1.0 because `ragas.metrics.Faithfulness` is deprecated for removal there.
    "ragas>=0.4,<1.0",
    # Verified the hard way: ragas 0.4.3 imports
    # `langchain_community.chat_models.vertexai` at module load, and
    # langchain-community 0.4 (now sunset upstream) deleted it — a fresh
    # install of ragas alone raises ModuleNotFoundError on `import ragas`.
    "langchain-community<0.4",
]

dev = [
    "ruff>=0.8",
    # Pinned, not floated: pyright-python downloads whatever npm version the
    # range allows, so a floating pin makes the type check non-reproducible —
    # a new release could fail the build with nothing in the diff to explain
    # it. It still checks npm and warns on stderr when a newer version exists;
    # CI sets PYRIGHT_PYTHON_IGNORE_WARNINGS=1 to keep that out of the log.
    "pyright==1.1.414",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # No HTTP-mocking library: respx patches httpx 0.x and everything we write
    # is on httpx2, so `MockHTTP` in tests/conftest.py routes requests over
    # `httpx2.MockTransport` instead — injected through the same `client=`
    # seam the app uses for pooling, rather than patching a module globally.
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # `-n 4` runs the suite in ~16s vs ~26s serial. Deliberately not in
    # addopts: interleaved output makes a failing test harder to read, and
    # `-n auto` is *slower* on a many-core machine (12 workers each pay
    # interpreter + fixture startup for a suite that only lasts 26s).
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# S = bandit (this app fetches URLs and spawns subprocesses), PT = pytest
# style, LOG/G = logging correctness (we use structlog), T20 = stray prints.
# The second row is cheap hygiene that was measured at zero or a handful of
# hits before being turned on: comprehension/perf refactors, implicit string
# concatenation, blind excepts (each remaining one carries its reason),
# unused arguments, leftover debugger calls and commented-out code.
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT", "LOG", "G", "T20",
    "FURB", "PERF", "ISC", "BLE", "ARG", "C4", "RET", "PIE", "FLY", "T10", "DTZ", "ERA",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are *meant* to be called in argument defaults;
# they are immutable, so B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, hardcoded dummy credentials are fine, fakes
# implement protocol signatures whose arguments they ignore, and a plain
# append loop reads better than a comprehension in a test.
"tests/**" = ["S101", "S105", "S106", "S311", "ARG", "PERF401"]
# CLIs report results to the console by design.
"evals/**" = ["T201", "S101"]
"src/assistant/rag/ingest.py" = ["T201"]

[tool.pyright]
include = ["src", "tests", "evals"]
typeCheckingMode = "standard"
# `src` is held to strict: every parameter and return annotated, no value of
# an unknown type flowing anywhere. That is affordable for 3k lines of
# application code and it is where a type error would reach a user. Tests and
# evals stay standard on purpose — a fake that ignores half a protocol
# signature, or a fixture returning a bare dict, is fine there and annotating
# it would add noise without catching anything.
#
# Where strict cannot be satisfied the suppression is at the call site with
# the reason: redis-py's overloads take a bare `Callable`, and `langgraph.graph`
# ships no `py.typed` marker. Those are the only two, and both are third-party.
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# --strict-markers/-config: a typo'd marker or ini key fails instead of being
# ignored. Warnings are errors so upstream deprecations surface at once.
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    # Two upstream warnings, each silenced by its own message rather than by
    # allowing a whole category: a blanket `default::DeprecationWarning` also
    # waves through deprecations in *our* code, which is the only kind worth
    # failing a build over. A run should print no warnings at all, so a new
    # one is visible the moment it appears.
    #
    # starlette's TestClient imports a deprecated anyio alias at module level.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # mcp's server settings model declares a forward reference pydantic-settings
    # cannot resolve; importing the bundled servers in-process trips it.
    "ignore:Field 'lifespan' has an incomplete definition:pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]
markers = ["slow: spawns real subprocesses (MCP stdio servers)"]

[tool.coverage.run]
source = ["src/assistant"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet: measured at 82.7% — raise as coverage improves, never lower it.
# Raised as coverage grew (82 -> 84 at a measured 84.7, -> 90 at a measured
# 92.3 on 2026-09-07, when the MCP servers, the hosted embedders and the
# exporter wiring got in-process tests). Kept a couple of points below the
# real number so an unrelated refactor does not fail the build, but close
# enough that deleting tests does.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
