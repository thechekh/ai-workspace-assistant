[project]
name = "ai-workspace-assistant"
version = "0.1.0"
description = "Internal AI workspace assistant — agentic FastAPI backend with MCP tools and Qdrant RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "openai>=1.55",
    "qdrant-client>=1.12",
    "mcp>=1.2",
    "pydantic-ai>=1.0",
    "langgraph>=0.6",
    "logfire[fastapi,httpx]>=3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "respx>=0.21",
    "fakeredis>=2.26",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "evals"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
