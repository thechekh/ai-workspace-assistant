# Dev default:      docker compose up -d              -> redis + qdrant only
# Full platform:    docker compose --profile app up   -> + api, worker, scheduler
# Observability:    docker compose --profile observability up
#                   -> + Jaeger :16686, Prometheus :9090, Grafana :3000
#                   (set ASSISTANT_OTLP_ENDPOINT=http://localhost:4318 for traces)
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    profiles: ["app"]
    build: .
    ports:
      - "8000:8000"
    environment:
      ASSISTANT_REDIS_URL: redis://redis:6379/0
      ASSISTANT_QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant

  worker:
    profiles: ["app"]
    build: .
    command: ["uv", "run", "--no-sync", "taskiq", "worker", "assistant.worker:broker"]
    environment:
      ASSISTANT_REDIS_URL: redis://redis:6379/0
      ASSISTANT_QDRANT_URL: http://qdrant:6333
    depends_on:
      - redis
      - qdrant

  scheduler:
    profiles: ["app"]
    build: .
    command: ["uv", "run", "--no-sync", "taskiq", "scheduler", "assistant.worker:scheduler"]
    environment:
      ASSISTANT_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  # --- Observability profile: zero-account local tracing + metrics ---------
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP http — ASSISTANT_OTLP_ENDPOINT points here

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a host-run API on Linux too
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  qdrant-data:
